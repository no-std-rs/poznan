version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /adapters/https
      - /checks/live
      - /checks/ram
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
